[pytest]
testpaths = tests
pythonpath = .

# Корневой каталог проекта импортируется как пакеты верхнего уровня
# (core, db, services, tg_bot, worker), поэтому sys.path расширяется
# через pythonpath, а не через костыли с sys.path.insert в conftest.
addopts =
    -ra
    --strict-markers
    --strict-config

# auto: асинхронный тест не нужно помечать вручную.
asyncio_mode = auto

# Один цикл событий на всю сессию. Иначе session-scoped движок БД
# создаётся в одном цикле, а используется в другом: asyncpg привязывает
# соединение к циклу, и тесты падают с "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    db: требует запущенный PostgreSQL (интеграционный тест слоя данных)
    redis: требует Redis или fakeredis
    slow: длительный тест, исключается из быстрого прогона

filterwarnings =
    error::DeprecationWarning:db.*
    error::DeprecationWarning:services.*
    error::DeprecationWarning:tg_bot.*
    error::DeprecationWarning:worker.*
    default
