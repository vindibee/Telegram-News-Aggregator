# Запуск из корня репозитория:
#   docker compose -f Docker/docker-compose.yml up -d --build
services:
  db:
    image: postgres:15-alpine
    container_name: news_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-news_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d обязателен: без имени БД pg_isready проверяет базу postgres,
      # которая готова раньше, чем создастся целевая.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-news_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bot:
    build:
      # Контекст — корень проекта, иначе COPY не увидит исходники.
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: news_bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Внутри compose-сети хост БД — имя сервиса, независимо от значения в .env.
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
