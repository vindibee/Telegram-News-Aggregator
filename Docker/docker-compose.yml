# Запуск из корня репозитория:
#   docker compose -f Docker/docker-compose.yml up -d --build
services:
  db:
    image: postgres:15-alpine
    container_name: news_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-news_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d обязателен: без имени БД pg_isready проверяет базу postgres,
      # которая готова раньше, чем создастся целевая.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-news_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: news_redis
    restart: unless-stopped
    # Ограничения частоты и состояния FSM переживают перезапуск, но не
    # являются критичными данными, поэтому персистентность минимальна.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      # Контекст — корень проекта, иначе COPY не увидит исходники.
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: news_bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Внутри compose-сети хост БД — имя сервиса, независимо от значения в .env.
      DB_HOST: db
      DB_PORT: 5432
      # Внутри compose-сети адрес Redis фиксирован именем сервиса.
      REDIS_URL: redis://redis:6379/0
    # Схема приводится к актуальной версии до старта поллинга.
    command: sh -c "alembic upgrade head && exec python -u main.py"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
